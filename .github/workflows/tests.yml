# Every push and pull request: the Python compiles, the dashboard page's script parses, the tests pass.
# Nothing here touches mps-frigate; deploying stays a step on the box (ops/deploy.sh).
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools the tests use (pdftoppm, Pillow, pikepdf)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q pytest pillow pikepdf openpyxl
      - name: Every .py compiles
        run: python -m compileall -q .
      - name: The dashboard page's script parses
        run: |
          python - <<'PY'
          import dashboard
          open("page.js", "w").write(dashboard.APP_HTML.split("<script>")[-1].split("</script>")[0])
          PY
          node --check page.js
      - name: Shell scripts parse
        run: for f in *.sh ops/*.sh; do bash -n "$f" || exit 1; done
      - name: Tests
        run: python -m pytest tests -q
